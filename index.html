<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nizhali V6 — Universal AR Player</title>

    <script src="./aframe.min.js"></script>

    <script>
        // 1. Universal Chroma Key Shader
        AFRAME.registerShader('chromakey', {
            schema: {
                src: { type: 'map', is: 'uniform' },
                color: { type: 'color', default: '#00ff00', is: 'uniform' },
                similarity: { type: 'number', default: 0.38, is: 'uniform' },
                smoothness: { type: 'number', default: 0.08, is: 'uniform' }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                #ifdef GL_FRAGMENT_PRECISION_HIGH
                precision highp float;
                #else
                precision mediump float;
                #endif
                uniform sampler2D src;
                uniform vec3 color;
                uniform float similarity;
                uniform float smoothness;
                varying vec2 vUv;
                void main() {
                    vec4 texColor = texture2D(src, vUv);
                    float Y1 = 0.2989 * texColor.r + 0.5866 * texColor.g + 0.1145 * texColor.b;
                    float Cr1 = texColor.r - Y1;
                    float Cb1 = texColor.b - Y1;
                    float Y2 = 0.2989 * color.r + 0.5866 * color.g + 0.1145 * color.b;
                    float Cr2 = color.r - Y2;
                    float Cb2 = color.b - Y2;
                    float dist = distance(vec2(Cr1, Cb1), vec2(Cr2, Cb2));
                    float blend = smoothstep(similarity, similarity + max(smoothness, 0.001), dist);
                    gl_FragColor = vec4(texColor.rgb * blend, texColor.a * blend);
                }
            `
        });

        // 2. Invisible Depth-Buffer Portal Window Mask Component (Hides negative-Z layers outside the print!)
        AFRAME.registerComponent('portal-occluder', {
            schema: { aspect: { type: 'number', default: 1.0 } },
            init: function() {
                const THREE = AFRAME.THREE;
                const aspect = this.data.aspect;
                const maskMat = new THREE.MeshBasicMaterial({
                    colorWrite: false, // Invisible to camera feed!
                    depthWrite: true,  // Blocks 3D objects behind it!
                    side: THREE.DoubleSide
                });
                const M = 15;
                const hW = 0.5;
                const hH = aspect / 2;
                const grp = new THREE.Group();

                const topP = new THREE.Mesh(new THREE.PlaneGeometry(M, (M - aspect) / 2), maskMat);
                topP.position.set(0, hH + (M - aspect) / 4, 0);
                const botP = new THREE.Mesh(new THREE.PlaneGeometry(M, (M - aspect) / 2), maskMat);
                botP.position.set(0, -hH - (M - aspect) / 4, 0);
                const leftP = new THREE.Mesh(new THREE.PlaneGeometry((M - 1) / 2, aspect), maskMat);
                leftP.position.set(-hW - (M - 1) / 4, 0, 0);
                const rightP = new THREE.Mesh(new THREE.PlaneGeometry((M - 1) / 2, aspect), maskMat);
                rightP.position.set(hW + (M - 1) / 4, 0, 0);

                [topP, botP, leftP, rightP].forEach(p => {
                    p.renderOrder = 0;
                    grp.add(p);
                });
                this.el.setObject3D('mesh', grp);
            }
        });

        // 3. Built-In Preset Animations Component
        AFRAME.registerComponent('nizhali-anim', {
            schema: {
                preset: { type: 'string', default: 'none' },
                speed: { type: 'number', default: 1.0 },
                amp: { type: 'number', default: 1.0 },
                basePos: { type: 'vec3' },
                baseScale: { type: 'vec3' },
                baseRot: { type: 'vec3' }
            },
            init: function() {
                this.startTime = performance.now();
                this.el.object3D.renderOrder = 1;
            },
            tick: function(time) {
                const d = this.data;
                if (!d.preset || d.preset === 'none') return;
                const elapsed = (time - this.startTime) / 1000;
                const t = elapsed * d.speed * 2.2;
                const obj = this.el.object3D;

                let px = d.basePos.x, py = d.basePos.y, pz = d.basePos.z;
                let sx = d.baseScale.x, sy = d.baseScale.y, sz = d.baseScale.z;
                let rx = d.baseRot.x, ry = d.baseRot.y, rz = d.baseRot.z;

                if (d.preset === 'float') {
                    pz += Math.sin(t) * 0.06 * d.amp;
                } else if (d.preset === 'spinY') {
                    ry = (ry + elapsed * 60 * d.speed) % 360;
                } else if (d.preset === 'spinZ') {
                    rz = (rz + elapsed * 60 * d.speed) % 360;
                } else if (d.preset === 'pulse') {
                    const f = 1 + Math.sin(t * 1.5) * 0.12 * d.amp;
                    sx *= f; sy *= f; sz *= f;
                } else if (d.preset === 'wiggle') {
                    rz += Math.sin(t * 2.5) * 8 * d.amp;
                    rx += Math.cos(t * 2.0) * 5 * d.amp;
                }

                obj.position.set(px, py, pz);
                obj.scale.set(sx, sy, sz);
                obj.rotation.set(
                    AFRAME.THREE.MathUtils.degToRad(rx),
                    AFRAME.THREE.MathUtils.degToRad(ry),
                    AFRAME.THREE.MathUtils.degToRad(rz)
                );
            }
        });
    </script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; position: relative; overflow: hidden; background: transparent !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        a-scene { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; z-index: 1; }
        .mindar-ui-overlay { z-index: 2 !important; }
        #status { position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(12px); color: #00ff88; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 99999; pointer-events: none; text-align: center; border: 1px solid rgba(255,255,255,0.15); transition: opacity 0.3s ease; white-space: nowrap; }
        #unmute-btn { position: fixed; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: none; background: #ffffff; color: #111111; border: none; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; z-index: 99999; cursor: pointer; box-shadow: 0 4px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="status">Initializing Nizhali V6...</div>
    <button id="unmute-btn">🔇 Tap for Sound</button>

    <script type="module">
        import './mindar-image-aframe.prod.js';

        const statusEl = document.getElementById('status');
        const unmuteBtn = document.getElementById('unmute-btn');
        let videoElements = [];
        let isMuted = true;
        let activeTargetFound = false;

        function cleanStorageUrl(url) {
            if (!url) return '';
            let clean = url.trim();
            if (clean.includes('dropbox.com')) {
                clean = clean.replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                             .replace('dropbox.com', 'dl.dropboxusercontent.com')
                             .replace(/[?&]dl=[01]/g, '');
            }
            return clean;
        }

        async function bootV6() {
            try {
                const params = new URLSearchParams(window.location.search);
                let mindUrl = '';
                let targetAspect = 1.0;
                let layers = [];

                if (params.get('scene')) {
                    const decoded = JSON.parse(decodeURIComponent(atob(params.get('scene'))));
                    mindUrl = cleanStorageUrl(decoded.m);
                    targetAspect = decoded.ta || 1.0;
                    layers = decoded.l.map(item => ({
                        type: item.t,
                        url: cleanStorageUrl(item.u),
                        posArr: item.p || [0,0,0],
                        scaleArr: item.s || [1,1,1],
                        rotArr: item.r || [0,0,0],
                        pos: (item.p || [0,0,0]).join(' '),
                        scale: (item.s || [1,1,1]).join(' '),
                        rot: (item.r || [0,0,0]).join(' '),
                        color: item.c || '#00ff00',
                        similarity: item.sim ?? 0.38,
                        smoothness: item.sm ?? 0.08,
                        portalMask: !!item.pm,
                        animPreset: item.ap || 'none',
                        animSpeed: item.as ?? 1.0,
                        animAmp: item.aa ?? 1.0
                    }));
                } else {
                    mindUrl = cleanStorageUrl(params.get('mind'));
                    const videoParam = params.get('video');
                    if (videoParam) {
                        layers = videoParam.split(',').map((vUrl, idx) => ({
                            type: 'video',
                            url: cleanStorageUrl(vUrl),
                            posArr: [0,0,0], scaleArr: [1,1,1], rotArr: [0,0,0],
                            pos: '0 0 0', scale: '1 1 1', rot: '0 0 0',
                            animPreset: 'none', animSpeed: 1, animAmp: 1
                        }));
                    }
                }

                if (!mindUrl || layers.length === 0) {
                    statusEl.textContent = '❌ Missing ?scene= or ?mind= in URL';
                    return;
                }

                statusEl.textContent = '1/2 Loading AR Target...';
                const checkRes = await fetch(mindUrl);
                if (!checkRes.ok) throw new Error(`Target file error (${checkRes.status})`);
                const mindBuffer = await checkRes.arrayBuffer();
                const localMindBlobUrl = URL.createObjectURL(new Blob([mindBuffer]));

                statusEl.textContent = '2/2 Starting Camera...';

                let assetsHtml = '';
                let entitiesHtml = '';

                // If any layer uses Portal Window Mask, inject the invisible depth-occluder ring at Z = 0!
                if (layers.some(l => l.portalMask)) {
                    entitiesHtml += `<a-entity portal-occluder="aspect: ${targetAspect}"></a-entity>`;
                }

                layers.forEach((l, idx) => {
                    const animAttr = `nizhali-anim="preset: ${l.animPreset}; speed: ${l.animSpeed}; amp: ${l.animAmp}; basePos: ${l.pos}; baseScale: ${l.scale}; baseRot: ${l.rot}"`;

                    if (l.type === 'video' || l.type === 'chroma') {
                        assetsHtml += `<video id="vid-${idx}" src="${l.url}" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>`;
                        if (l.type === 'chroma') {
                            entitiesHtml += `<a-plane id="ent-${idx}" position="${l.pos}" scale="${l.scale}" rotation="${l.rot}" ${animAttr} width="1" height="1" material="shader: chromakey; src: #vid-${idx}; color: ${l.color}; similarity: ${l.similarity}; smoothness: ${l.smoothness}; transparent: true; side: double"></a-plane>`;
                        } else {
                            entitiesHtml += `<a-video id="ent-${idx}" src="#vid-${idx}" position="${l.pos}" scale="${l.scale}" rotation="${l.rot}" ${animAttr} width="1" height="1"></a-video>`;
                        }
                    } else if (l.type === 'image') {
                        entitiesHtml += `<a-image id="ent-${idx}" src="${l.url}" position="${l.pos}" scale="${l.scale}" rotation="${l.rot}" ${animAttr} width="1" height="1" material="transparent: true; alphaTest: 0.02; side: double"></a-image>`;
                    } else if (l.type === 'glb') {
                        entitiesHtml += `<a-gltf-model id="ent-${idx}" src="${l.url}" position="${l.pos}" scale="${l.scale}" rotation="${l.rot}" ${animAttr}></a-gltf-model>`;
                    }
                });

                window.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2.0);

                const sceneWrapper = document.createElement('div');
                sceneWrapper.style.width = '100%';
                sceneWrapper.style.height = '100%';
                sceneWrapper.innerHTML = `
                    <a-scene
                        id="ar-scene"
                        mindar-image="imageTargetSrc: ${localMindBlobUrl}; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes; filterMinCF: 10; filterBeta: 10000; warmupTolerance: 1; missTolerance: 5;"
                        color-space="sRGB"
                        renderer="colorManagement: true, physicallyCorrectLights: false, alpha: true, antialias: true, powerPreference: high-performance"
                        vr-mode-ui="enabled: false"
                        device-orientation-permission-ui="enabled: false"
                        embedded>
                        <a-assets timeout="10000">${assetsHtml}</a-assets>
                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                        <a-entity id="target-root" mindar-image-target="targetIndex: 0">
                            ${entitiesHtml}
                        </a-entity>
                    </a-scene>
                `;

                document.body.appendChild(sceneWrapper);

                const sceneEl = document.getElementById('ar-scene');
                const targetRoot = document.getElementById('target-root');

                layers.forEach((l, idx) => {
                    if (l.type === 'video' || l.type === 'chroma') {
                        const vid = document.getElementById(`vid-${idx}`);
                        const ent = document.getElementById(`ent-${idx}`);
                        videoElements.push(vid);

                        vid.addEventListener('loadedmetadata', () => {
                            if (vid.videoWidth && vid.videoHeight) {
                                ent.setAttribute('height', (vid.videoHeight / vid.videoWidth).toFixed(4));
                            }
                        });
                    }
                });

                targetRoot.addEventListener('targetFound', () => {
                    activeTargetFound = true;
                    statusEl.textContent = '🎯 Target Locked';
                    setTimeout(() => { if (activeTargetFound) statusEl.style.opacity = '0'; }, 1500);
                    videoElements.forEach(vid => {
                        vid.muted = isMuted;
                        vid.play().catch(() => {
                            vid.muted = true;
                            isMuted = true;
                            vid.play();
                        });
                    });
                    if (videoElements.length > 0) unmuteBtn.style.display = 'block';
                });

                targetRoot.addEventListener('targetLost', () => {
                    activeTargetFound = false;
                    statusEl.style.opacity = '1';
                    statusEl.textContent = '📷 Scan Print';
                    videoElements.forEach(vid => vid.pause());
                });

                sceneEl.addEventListener('arReady', () => {
                    statusEl.textContent = '✅ AR Ready! Scan Print';
                });

            } catch (err) {
                statusEl.textContent = '❌ ' + err.message;
            }
        }

        function toggleAudio() {
            isMuted = !isMuted;
            videoElements.forEach(vid => {
                vid.muted = isMuted;
                if (!isMuted) vid.play();
            });
            unmuteBtn.textContent = isMuted ? '🔇 Tap for Sound' : '🔊 Sound On';
        }

        unmuteBtn.addEventListener('click', toggleAudio);
        unmuteBtn.addEventListener('touchend', (e) => { e.preventDefault(); toggleAudio(); });
        window.addEventListener('load', bootV6);
    </script>
</body>
</html>
