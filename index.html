<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nizhali V5</title>

    <!-- Load A-Frame first -->
    <script src="./aframe.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        a-scene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        body > video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            z-index: -2 !important;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            pointer-events: none;
            text-align: center;
            max-width: 90%;
        }

        #unmute-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="status">1/3 Loading MindAR Engine...</div>
    <button id="unmute-btn">🔇 Tap for Sound</button>

    <script type="module">
        // Force MindAR to register with A-Frame BEFORE we build the scene
        import './mindar-image-aframe.prod.js';

        const statusEl = document.getElementById('status');
        const unmuteBtn = document.getElementById('unmute-btn');
        let activeVideo = null;
        let isMuted = true;

        function cleanDropbox(url) {
            if (!url) return '';
            return url.trim()
                .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                .replace('dropbox.com', 'dl.dropboxusercontent.com')
                .replace(/[?&]dl=[01]/g, '');
        }

        async function startApp() {
            // Wait until A-Frame confirms mindar-image is registered
            while (!AFRAME.systems['mindar-image-system'] && !AFRAME.components['mindar-image']) {
                await new Promise(r => setTimeout(r, 50));
            }

            const params = new URLSearchParams(window.location.search);
            const mindUrl = cleanDropbox(params.get('mind'));
            const videoParam = params.get('video');

            if (!mindUrl || !videoParam) {
                statusEl.textContent = '❌ Missing ?mind= or ?video= in URL';
                return;
            }

            statusEl.textContent = '2/3 Downloading .mind & starting camera...';

            const videos = videoParam.split(',').map(cleanDropbox);

            const scene = document.createElement('a-scene');
            scene.setAttribute('mindar-image', `imageTargetSrc: ${mindUrl}; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;`);
            scene.setAttribute('color-space', 'sRGB');
            scene.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights: true, alpha: true');
            scene.setAttribute('vr-mode-ui', 'enabled: false');
            scene.setAttribute('device-orientation-permission-ui', 'enabled: false');

            const assets = document.createElement('a-assets');
            scene.appendChild(assets);

            const camera = document.createElement('a-camera');
            camera.setAttribute('position', '0 0 0');
            camera.setAttribute('look-controls', 'enabled: false');
            scene.appendChild(camera);

            videos.forEach((url, index) => {
                const vid = document.createElement('video');
                vid.id = `vid-${index}`;
                vid.src = url;
                vid.loop = true;
                vid.muted = true;
                vid.playsInline = true;
                vid.crossOrigin = 'anonymous';
                vid.setAttribute('playsinline', '');
                vid.setAttribute('webkit-playsinline', '');
                vid.setAttribute('preload', 'auto');
                vid.load();
                assets.appendChild(vid);

                const target = document.createElement('a-entity');
                target.setAttribute('mindar-image-target', `targetIndex: ${index}`);

                const plane = document.createElement('a-video');
                plane.setAttribute('src', `#vid-${index}`);
                plane.setAttribute('position', '0 0 0');
                plane.setAttribute('width', '1');
                plane.setAttribute('height', '1');
                target.appendChild(plane);

                vid.addEventListener('loadedmetadata', () => {
                    if (vid.videoWidth && vid.videoHeight) {
                        plane.setAttribute('height', (vid.videoHeight / vid.videoWidth).toFixed(4));
                    }
                });

                target.addEventListener('targetFound', () => {
                    statusEl.textContent = '🎯 TARGET FOUND! Playing video...';
                    activeVideo = vid;
                    vid.muted = isMuted;
                    vid.play().catch(err => {
                        statusEl.textContent = '⚠️ Tap screen to play video';
                        vid.muted = true;
                        vid.play();
                    });
                    unmuteBtn.style.display = 'block';
                });

                target.addEventListener('targetLost', () => {
                    statusEl.textContent = '👀 Target lost — scan image again';
                    vid.pause();
                });

                scene.appendChild(target);
            });

            scene.addEventListener('arReady', () => {
                statusEl.textContent = '✅ AR Ready! Scan your image';
            });

            scene.addEventListener('arError', (e) => {
                statusEl.textContent = '❌ AR Error: Could not load .mind file';
            });

            document.body.appendChild(scene);
        }

        unmuteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (activeVideo) {
                activeVideo.muted = isMuted;
                if (!isMuted) activeVideo.play();
            }
            unmuteBtn.textContent = isMuted ? '🔇 Tap for Sound' : '🔊 Sound On';
        });

        startApp();
    </script>
</body>
</html>
