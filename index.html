<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nizhali V5</title>

    <!-- 1. Self-Hosted Core Libraries -->
    <script src="./aframe.min.js"></script>
    <script src="./crypto-js.min.js"></script>
    <script type="module" src="./mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        #unmute-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="status">Loading Nizhali Engine...</div>
    <button id="unmute-btn">🔇 Tap for Sound</button>

    <!-- Static A-Frame Scene (Just like V4!) with autoStart: false until targets are ready -->
    <a-scene
        id="ar-scene"
        mindar-image="autoStart: false; uiLoading: no; uiError: no; uiScanning: yes;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets id="ar-assets"></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script type="module">
        import './mindar-image-aframe.prod.js';

        const statusEl = document.getElementById('status');
        const unmuteBtn = document.getElementById('unmute-btn');
        const sceneEl = document.getElementById('ar-scene');
        const assetsEl = document.getElementById('ar-assets');

        let activeVideo = null;
        let isMuted = true;

        function cleanDropbox(url) {
            if (!url) return '';
            return url.trim()
                .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                .replace('dropbox.com', 'dl.dropboxusercontent.com')
                .replace(/[?&]dl=[01]/g, '');
        }

        function initTargets() {
            const params = new URLSearchParams(window.location.search);
            const mindUrl = cleanDropbox(params.get('mind'));
            const videoParam = params.get('video');

            if (!mindUrl || !videoParam) {
                statusEl.textContent = '❌ Missing ?mind= or ?video= in URL';
                return;
            }

            const videos = videoParam.split(',').map(cleanDropbox);

            // 1. Build video assets & target entities BEFORE starting MindAR
            videos.forEach((url, index) => {
                const vid = document.createElement('video');
                vid.id = `vid-${index}`;
                vid.src = url;
                vid.loop = true;
                vid.muted = true;
                vid.playsInline = true;
                vid.crossOrigin = 'anonymous';
                vid.setAttribute('playsinline', '');
                vid.setAttribute('webkit-playsinline', '');
                vid.setAttribute('preload', 'auto');
                assetsEl.appendChild(vid);

                const target = document.createElement('a-entity');
                target.setAttribute('mindar-image-target', `targetIndex: ${index}`);

                const plane = document.createElement('a-video');
                plane.setAttribute('src', `#vid-${index}`);
                plane.setAttribute('position', '0 0 0');
                plane.setAttribute('width', '1');
                plane.setAttribute('height', '1');
                target.appendChild(plane);

                vid.addEventListener('loadedmetadata', () => {
                    if (vid.videoWidth && vid.videoHeight) {
                        plane.setAttribute('height', (vid.videoHeight / vid.videoWidth).toFixed(4));
                    }
                });

                target.addEventListener('targetFound', () => {
                    statusEl.textContent = '🎯 TARGET FOUND! Playing...';
                    activeVideo = vid;
                    vid.muted = isMuted;
                    vid.play().catch(() => {
                        vid.muted = true;
                        isMuted = true;
                        vid.play();
                    });
                    unmuteBtn.style.display = 'block';
                });

                target.addEventListener('targetLost', () => {
                    statusEl.textContent = '📷 Scan your image';
                    vid.pause();
                });

                sceneEl.appendChild(target);
            });

            // 2. Set the .mind URL on the scene and start MindAR once A-Frame is ready
            sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${mindUrl}; autoStart: false; uiLoading: no; uiError: no; uiScanning: yes;`);

            const startMindAR = () => {
                statusEl.textContent = 'Starting Camera & Tracker...';
                const arSystem = sceneEl.systems['mindar-image-system'];
                if (arSystem) {
                    arSystem.start();
                }
            };

            if (sceneEl.hasLoaded) {
                startMindAR();
            } else {
                sceneEl.addEventListener('loaded', startMindAR);
            }
        }

        sceneEl.addEventListener('arReady', () => {
            statusEl.textContent = '✅ AR Ready! Scan your image';
        });

        sceneEl.addEventListener('arError', () => {
            statusEl.textContent = '❌ Error starting AR';
        });

        unmuteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (activeVideo) {
                activeVideo.muted = isMuted;
                if (!isMuted) activeVideo.play();
            }
            unmuteBtn.textContent = isMuted ? '🔇 Tap for Sound' : '🔊 Sound On';
        });

        initTargets();
    </script>
</body>
</html>
