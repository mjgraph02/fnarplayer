<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nizhali V7.3 — Universal Multi-Target AR Player</title>

    <!-- Load A-Frame & CryptoJS from ./vendor/ -->
    <script src="./vendor/aframe.min.js"></script>
    <script src="./vendor/crypto-js.min.js"></script>

    <script>
        // 1. Create custom Three.js ShaderMaterial directly on each layer (eliminates A-Frame black texture bugs!)
        function createNizhaliShaderMaterial(tex, cfg) {
            const THREE = AFRAME.THREE;
            const isChroma = (cfg.t === 'chroma');
            return new THREE.ShaderMaterial({
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false,
                uniforms: {
                    src: { value: tex },
                    hasTex: { value: tex ? 1.0 : 0.0 },
                    color: { value: new THREE.Color(cfg.c || '#00ff00') },
                    similarity: { value: cfg.sim ?? 0.38 },
                    smoothness: { value: cfg.sm ?? 0.08 },
                    enableChroma: { value: isChroma ? 1.0 : 0.0 },
                    opacity: { value: cfg.op ?? 1.0 },
                    useClip: { value: 0.0 },
                    invRefMat: { value: new THREE.Matrix4() },
                    halfBounds: { value: new THREE.Vector2(0.5, 0.5) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vWorldPos;
                    void main() {
                        vUv = uv;
                        vec4 wp = modelMatrix * vec4(position, 1.0);
                        vWorldPos = wp.xyz;
                        gl_Position = projectionMatrix * viewMatrix * wp;
                    }
                `,
                fragmentShader: `
                    #ifdef GL_FRAGMENT_PRECISION_HIGH
                    precision highp float;
                    #else
                    precision mediump float;
                    #endif
                    uniform sampler2D src;
                    uniform float hasTex;
                    uniform vec3 color;
                    uniform float similarity;
                    uniform float smoothness;
                    uniform float enableChroma;
                    uniform float opacity;
                    uniform float useClip;
                    uniform mat4 invRefMat;
                    uniform vec2 halfBounds;
                    varying vec2 vUv;
                    varying vec3 vWorldPos;
                    void main() {
                        if (hasTex < 0.5) discard;
                        if (useClip > 0.5) {
                            vec4 localPos = invRefMat * vec4(vWorldPos, 1.0);
                            if (abs(localPos.x) > halfBounds.x || abs(localPos.y) > halfBounds.y) discard;
                        }
                        vec4 texColor = texture2D(src, vUv);
                        if (enableChroma > 0.5) {
                            float Y1 = 0.2989 * texColor.r + 0.5866 * texColor.g + 0.1145 * texColor.b;
                            float Y2 = 0.2989 * color.r + 0.5866 * color.g + 0.1145 * color.b;
                            float d = distance(vec2(texColor.r - Y1, texColor.b - Y1), vec2(color.r - Y2, color.b - Y2));
                            float b = smoothstep(similarity, similarity + max(smoothness, 0.001), d);
                            if (b * opacity < 0.01) discard;
                            gl_FragColor = vec4(texColor.rgb * b, texColor.a * b * opacity);
                        } else {
                            if (texColor.a * opacity < 0.01) discard;
                            gl_FragColor = vec4(texColor.rgb, texColor.a * opacity);
                        }
                    }
                `
            });
        }

        // 2. Build a 3D Portal Depth-Mask Frame at Z=0 so -Z layers look like a real window inside the print!
        function createPortalWindowFrame(halfW, halfH) {
            const THREE = AFRAME.THREE;
            const group = new THREE.Group();

            // Invisible Depth Occluder Ring around the outside of the print/mask window (at Z = 0)
            // Any pixel of a -Z layer that slides behind this outer ring when tilting the phone is hidden!
            const outerShape = new THREE.Shape();
            const pad = 4.0;
            outerShape.moveTo(-pad, -pad);
            outerShape.lineTo( pad, -pad);
            outerShape.lineTo( pad,  pad);
            outerShape.lineTo(-pad,  pad);
            outerShape.closePath();

            const holePath = new THREE.Path();
            holePath.moveTo(-halfW, -halfH);
            holePath.lineTo( halfW, -halfH);
            holePath.lineTo( halfW,  halfH);
            holePath.lineTo(-halfW,  halfH);
            holePath.closePath();
            outerShape.holes.push(holePath);

            const ringGeo = new THREE.ShapeGeometry(outerShape);
            const occluderMat = new THREE.MeshBasicMaterial({
                colorWrite: false,
                depthWrite: true,
                side: THREE.DoubleSide
            });
            const ringMesh = new THREE.Mesh(ringGeo, occluderMat);
            ringMesh.renderOrder = -1;
            group.add(ringMesh);

            return group;
        }

        // 3. Per-Layer Keyframe + Preset Animation + Target-Local Clipping Controller
        AFRAME.registerComponent('nizhali-layer', {
            schema: {
                configJson: { type: 'string', default: '{}' },
                targetIndex: { type: 'number', default: 0 },
                targetAspect: { type: 'number', default: 1.0 },
                masterDuration: { type: 'number', default: 0.0 }
            },
            init: function() {
                const THREE = AFRAME.THREE;
                this.cfg = JSON.parse(decodeURIComponent(this.data.configJson));
                this.startTime = performance.now();
                this.invRefMat = new THREE.Matrix4();
                this.el.sceneEl.renderer.localClippingEnabled = true;

                // Ensure layer renders after the portal occluder ring (renderOrder >= 1)
                this.el.object3D.renderOrder = 1 + (this.cfg.p ? Math.round((this.cfg.p[2] + 2) * 10) : 1);
            },
            evalKf: function(param, baseVal, t) {
                const kfs = this.cfg.kf && this.cfg.kf[param];
                if (!kfs || kfs.length === 0) return baseVal;
                if (kfs.length === 1 || t <= kfs[0].t) return kfs[0].v;
                if (t >= kfs[kfs.length - 1].t) return kfs[kfs.length - 1].v;
                for (let i = 0; i < kfs.length - 1; i++) {
                    if (t >= kfs[i].t && t <= kfs[i + 1].t) {
                        const span = kfs[i + 1].t - kfs[i].t;
                        const r = span > 0.0001 ? (t - kfs[i].t) / span : 0;
                        const sr = r * r * (3 - 2 * r);
                        return kfs[i].v + (kfs[i + 1].v - kfs[i].v) * sr;
                    }
                }
                return baseVal;
            },
            tick: function(time) {
                const THREE = AFRAME.THREE;
                const c = this.cfg;
                const rawElapsed = (time - this.startTime) / 1000;
                const dur = this.data.masterDuration;
                const t = dur > 0 ? (rawElapsed % dur) : rawElapsed;

                let px = this.evalKf('posX', c.p[0], t);
                let py = this.evalKf('posY', c.p[1], t);
                let pz = this.evalKf('posZ', c.p[2], t);
                let sx = this.evalKf('scaleX', c.s[0], t);
                let sy = this.evalKf('scaleY', c.s[1], t);
                let sz = this.evalKf('scaleZ', c.s[2], t);
                let rx = this.evalKf('rotX', c.r[0], t);
                let ry = this.evalKf('rotY', c.r[1], t);
                let rz = this.evalKf('rotZ', c.r[2], t);
                let op = this.evalKf('opacity', c.op ?? 1.0, t);
                let spd = this.evalKf('animSpeed', c.as ?? 1.0, t);
                let amp = this.evalKf('animAmp', c.aa ?? 1.0, t);
                let sim = this.evalKf('similarity', c.sim ?? 0.38, t);
                let sm  = this.evalKf('smoothness', c.sm ?? 0.08, t);

                if (c.ap && c.ap !== 'none') {
                    const phase = t * spd * 2.2;
                    if (c.ap === 'float') pz += Math.sin(phase) * 0.06 * amp;
                    else if (c.ap === 'spinY') ry = (ry + t * 60 * spd) % 360;
                    else if (c.ap === 'spinZ') rz = (rz + t * 60 * spd) % 360;
                    else if (c.ap === 'pulse') {
                        const f = 1 + Math.sin(phase * 1.5) * 0.12 * amp;
                        sx *= f; sy *= f; sz *= f;
                    } else if (c.ap === 'wiggle') {
                        rz += Math.sin(phase * 2.5) * 8 * amp;
                        rx += Math.cos(phase * 2.0) * 5 * amp;
                    } else if (c.ap === 'fadeIn') {
                        const d = dur > 0 ? dur : 3.0;
                        op *= Math.min(1, (t * spd) / (d * 0.4));
                    } else if (c.ap === 'fadeOut') {
                        const d = dur > 0 ? dur : 3.0;
                        op *= Math.max(0, 1 - (t * spd) / d);
                    }
                }

                const obj = this.el.object3D;
                obj.position.set(px, py, pz);
                obj.scale.set(sx, sy, sz);
                obj.rotation.set(
                    THREE.MathUtils.degToRad(rx),
                    THREE.MathUtils.degToRad(ry),
                    THREE.MathUtils.degToRad(rz)
                );

                // Compute Target-Local Clipping Bounds (if layer is unclipped or at Z >= 0)
                // Note: If layer is behind the print (pz < -0.005) and clipped, the 3D Portal Occluder Ring at Z=0
                // handles true 3D window perspective clipping! For Z >= 0 layers, local X/Y bounds clip it cleanly.
                const cs = c.cs;
                let useLocalClip = false;
                let halfW = 0.5;
                let halfH = this.data.targetAspect / 2;

                if (cs && cs !== 'none') {
                    const tIdx = this.data.targetIndex;
                    let refEl = document.getElementById(`target-root-${tIdx}`);
                    if (cs !== 'target') {
                        const maskEl = document.getElementById(`mask-${tIdx}-${cs}`);
                        if (maskEl) {
                            refEl = maskEl;
                            halfW = 0.5;
                            halfH = 0.5;
                        }
                    }
                    if (refEl && refEl.object3D) {
                        refEl.object3D.updateMatrixWorld(true);
                        this.invRefMat.copy(refEl.object3D.matrixWorld).invert();
                        // If layer is at Z >= -0.01, clip strictly in X/Y; if deep behind Z < -0.01, let the Z=0 Portal Window Occluder clip it in 3D perspective!
                        useLocalClip = (pz >= -0.01);
                    }
                }

                obj.traverse(child => {
                    if (child.isMesh && child.material) {
                        if (child.material.uniforms && child.material.uniforms.opacity) {
                            child.material.uniforms.opacity.value = op;
                            child.material.uniforms.similarity.value = sim;
                            child.material.uniforms.smoothness.value = sm;
                            child.material.uniforms.useClip.value = useLocalClip ? 1.0 : 0.0;
                            if (useLocalClip) {
                                child.material.uniforms.invRefMat.value.copy(this.invRefMat);
                                child.material.uniforms.halfBounds.value.set(halfW, halfH);
                            }
                        } else {
                            child.material.transparent = true;
                            child.material.opacity = op;
                        }
                    }
                });
            }
        });
    </script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
            position: relative; overflow: hidden; background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        a-scene {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important; z-index: 1;
            background: transparent !important;
        }
        body > video {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; z-index: -2 !important;
        }
        .mindar-ui-overlay { z-index: 2 !important; }
        #status {
            position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%;
            transform: translateX(-50%); background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #00ff88; padding: 10px 20px; border-radius: 30px;
            font-size: 13px; font-weight: 600; z-index: 99999; pointer-events: none;
            text-align: center; border: 1px solid rgba(255,255,255,0.15);
            transition: opacity 0.3s ease; white-space: nowrap;
        }
        #unmute-btn {
            position: fixed; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%;
            transform: translateX(-50%); display: none; background: #ffffff;
            color: #111111; border: none; padding: 12px 24px; border-radius: 30px;
            font-size: 14px; font-weight: 700; z-index: 99999; cursor: pointer;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="status">Initializing Nizhali V7.3...</div>
    <button id="unmute-btn">🔇 Tap for Sound</button>

    <script type="module">
        import './vendor/mindar-image-aframe.prod.js';

        const statusEl = document.getElementById('status');
        const unmuteBtn = document.getElementById('unmute-btn');
        let allVideosByTarget = {}; // { 0: [vid, ...], 1: [vid, ...] }
        let isMuted = true;
        let activeTargetsCount = 0;

        function cleanStorageUrl(url) {
            if (!url) return '';
            let clean = url.trim();
            if (clean.includes('dropbox.com')) {
                clean = clean.replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                             .replace('dropbox.com', 'dl.dropboxusercontent.com')
                             .replace(/[?&]dl=[01]/g, '');
            }
            return clean;
        }

        // Convert full project.json into normalized multi-target array
        function normalizeProjectJson(projData) {
            const rawTargets = projData.targets || [];
            const targets = rawTargets.map((t, idx) => {
                const rawLayers = t.layers || [];
                const masks = rawLayers.filter(l => l.isMaskPlane).map(m => ({
                    id: m.id, p: m.pos || [0,0,0], s: m.scale || [1,1,1], r: m.rot || [0,0,0]
                }));
                const mediaLayers = rawLayers.filter(l => !l.isFolder && !l.isMaskPlane).map(l => ({
                    t: l.chromaEnabled ? 'chroma' : (l.type || 'video'),
                    u: cleanStorageUrl(l.url),
                    p: l.pos || [0,0,0],
                    s: l.scale || [1,1,1],
                    r: l.rot || [0,0,0],
                    op: l.opacity ?? 1.0,
                    cs: l.clipSource || 'none',
                    c: l.color || '#00ff00',
                    sim: l.similarity ?? 0.38,
                    sm: l.smoothness ?? 0.08,
                    ap: l.animPreset || 'none',
                    as: l.animSpeed ?? 1.0,
                    aa: l.animAmp ?? 1.0,
                    kf: l.keyframes || {}
                }));
                return {
                    idx: idx,
                    name: t.name || `Target ${idx + 1}`,
                    ta: t.targetAspect || 1.0,
                    dur: t.customDuration || 0,
                    masks,
                    l: mediaLayers
                };
            });
            return {
                m: cleanStorageUrl(projData.mindUrl),
                targets
            };
        }

        async function bootV7() {
            try {
                while (!AFRAME.systems['mindar-image-system'] && !AFRAME.components['mindar-image']) {
                    await new Promise(r => setTimeout(r, 50));
                }

                const params = new URLSearchParams(window.location.search);
                let mindUrl = '';
                let targetsList = [];

                // Mode 1: ?scene= (V7.3 Multi-Target or V7.2 Single-Target Base64/AES)
                if (params.get('scene')) {
                    let token = params.get('scene');
                    let jsonStr = '';
                    if (token.startsWith('AES_') && window.CryptoJS) {
                        const bytes = window.CryptoJS.AES.decrypt(token.slice(4), 'NIZHALI_V7_KEY');
                        jsonStr = bytes.toString(window.CryptoJS.enc.Utf8);
                    } else {
                        jsonStr = decodeURIComponent(atob(token));
                    }
                    const decoded = JSON.parse(jsonStr);
                    mindUrl = cleanStorageUrl(decoded.m);

                    if (decoded.targets && Array.isArray(decoded.targets)) {
                        targetsList = decoded.targets.map((t, idx) => ({
                            idx: t.idx ?? idx,
                            name: t.name || `Print ${idx + 1}`,
                            ta: t.ta || 1.0,
                            dur: t.dur || 0,
                            masks: t.masks || [],
                            l: (t.l || []).map(item => ({ ...item, u: cleanStorageUrl(item.u) }))
                        }));
                    } else {
                        // Legacy single-target ?scene= fallback
                        targetsList = [{
                            idx: 0,
                            name: 'Print 1',
                            ta: decoded.ta || 1.0,
                            dur: decoded.dur || 0,
                            masks: decoded.masks || [],
                            l: (decoded.l || []).map(item => ({ ...item, u: cleanStorageUrl(item.u) }))
                        }];
                    }
                }
                // Mode 2: ?project= (External Dropbox project.json Link)
                else if (params.get('project')) {
                    statusEl.textContent = 'Loading project.json...';
                    const pUrl = cleanStorageUrl(decodeURIComponent(params.get('project')));
                    const pRes = await fetch(pUrl);
                    if (!pRes.ok) throw new Error('Could not load project.json from Dropbox');
                    const projData = await pRes.json();
                    const norm = normalizeProjectJson(projData);
                    mindUrl = norm.m;
                    targetsList = norm.targets;
                }
                // Mode 3: ?projectData= (Inline Base64 project.json)
                else if (params.get('projectData')) {
                    const projData = JSON.parse(decodeURIComponent(atob(params.get('projectData'))));
                    const norm = normalizeProjectJson(projData);
                    mindUrl = norm.m;
                    targetsList = norm.targets;
                }

                if (!mindUrl || targetsList.length === 0) {
                    statusEl.textContent = '❌ Missing .mind link or targets in URL';
                    return;
                }

                statusEl.textContent = '1/2 Loading AR Targets...';
                const checkRes = await fetch(mindUrl);
                if (!checkRes.ok) throw new Error(`Target .mind error (${checkRes.status})`);
                const mindBuffer = await checkRes.arrayBuffer();
                const localMindBlobUrl = URL.createObjectURL(new Blob([mindBuffer]));

                statusEl.textContent = '2/2 Starting Camera...';

                // Build <a-entity mindar-image-target="targetIndex: X"> for EVERY target slot!
                let allTargetsHtml = '';

                targetsList.forEach((tSlot, tIdx) => {
                    allVideosByTarget[tIdx] = [];
                    let childrenHtml = '';

                    (tSlot.masks || []).forEach(m => {
                        childrenHtml += `<a-entity id="mask-${tIdx}-${m.id}" position="${m.p.join(' ')}" scale="${m.s.join(' ')}" rotation="${m.r.join(' ')}"></a-entity>`;
                    });

                    (tSlot.l || []).forEach((l, lIdx) => {
                        const posStr = (l.p || [0,0,0]).join(' ');
                        const scaleStr = (l.s || [1,1,1]).join(' ');
                        const rotStr = (l.r || [0,0,0]).join(' ');
                        const encodedCfg = encodeURIComponent(JSON.stringify(l));
                        const compAttr = `nizhali-layer="configJson: ${encodedCfg}; targetIndex: ${tIdx}; targetAspect: ${tSlot.ta || 1.0}; masterDuration: ${tSlot.dur || 0}"`;
                        const entId = `ent-${tIdx}-${lIdx}`;

                        if (l.t === 'glb') {
                            childrenHtml += `<a-gltf-model id="${entId}" src="${l.u}" position="${posStr}" scale="${scaleStr}" rotation="${rotStr}" ${compAttr}></a-gltf-model>`;
                        } else {
                            childrenHtml += `<a-entity id="${entId}" position="${posStr}" scale="${scaleStr}" rotation="${rotStr}" ${compAttr}></a-entity>`;
                        }
                    });

                    allTargetsHtml += `
                        <a-entity id="target-root-${tIdx}" mindar-image-target="targetIndex: ${tIdx}">
                            ${childrenHtml}
                        </a-entity>
                    `;
                });

                window.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2.0);

                const sceneWrapper = document.createElement('div');
                sceneWrapper.style.width = '100%';
                sceneWrapper.style.height = '100%';
                sceneWrapper.innerHTML = `
                    <a-scene
                        id="ar-scene"
                        mindar-image="imageTargetSrc: ${localMindBlobUrl}; maxTrack: 2; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 1; missTolerance: 5;"
                        color-space="sRGB"
                        renderer="colorManagement: true, physicallyCorrectLights: false, alpha: true, antialias: true, powerPreference: high-performance"
                        vr-mode-ui="enabled: false"
                        device-orientation-permission-ui="enabled: false"
                        embedded>
                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                        ${allTargetsHtml}
                    </a-scene>
                `;

                document.body.appendChild(sceneWrapper);

                const sceneEl = document.getElementById('ar-scene');
                const THREE = AFRAME.THREE;

                // Hydrate Three.js Video/Image Planes & 3D Portal Window Occluders for each Target Slot
                targetsList.forEach((tSlot, tIdx) => {
                    const targetRootEl = document.getElementById(`target-root-${tIdx}`);
                    const tAspect = tSlot.ta || 1.0;

                    // Check if any layer on this target is pushed into -Z with a portal clip mask
                    const needsTargetPortalOccluder = (tSlot.l || []).some(l => l.cs === 'target' && l.p && l.p[2] < -0.01);
                    if (needsTargetPortalOccluder && targetRootEl) {
                        const portalFrame = createPortalWindowFrame(0.5, tAspect / 2);
                        targetRootEl.object3D.add(portalFrame);
                    }

                    // Also attach portal occluders to any custom mask planes used by -Z layers
                    (tSlot.masks || []).forEach(m => {
                        const usedByDeepLayer = (tSlot.l || []).some(l => l.cs === m.id && l.p && l.p[2] < -0.01);
                        const maskEl = document.getElementById(`mask-${tIdx}-${m.id}`);
                        if (usedByDeepLayer && maskEl) {
                            maskEl.object3D.add(createPortalWindowFrame(0.5, 0.5));
                        }
                    });

                    (tSlot.l || []).forEach((l, lIdx) => {
                        const ent = document.getElementById(`ent-${tIdx}-${lIdx}`);
                        if (!ent) return;

                        if (l.t === 'video' || l.t === 'chroma') {
                            const vid = document.createElement('video');
                            vid.crossOrigin = 'anonymous';
                            vid.src = l.u;
                            vid.loop = true;
                            vid.muted = true;
                            vid.playsInline = true;
                            vid.setAttribute('playsinline', '');
                            vid.setAttribute('webkit-playsinline', '');
                            vid.preload = 'auto';
                            allVideosByTarget[tIdx].push(vid);

                            const vidTex = new THREE.VideoTexture(vid);
                            vidTex.minFilter = THREE.LinearFilter;
                            vidTex.magFilter = THREE.LinearFilter;
                            vidTex.encoding = THREE.sRGBEncoding;

                            const mat = createNizhaliShaderMaterial(vidTex, l);
                            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, tAspect), mat);
                            mesh.renderOrder = 2 + lIdx;
                            ent.object3D.add(mesh);

                            vid.addEventListener('loadedmetadata', () => {
                                if (vid.videoWidth && vid.videoHeight) {
                                    mesh.geometry.dispose();
                                    mesh.geometry = new THREE.PlaneGeometry(1, vid.videoHeight / vid.videoWidth);
                                }
                            });
                            vid.load();
                        } else if (l.t === 'image') {
                            const mat = createNizhaliShaderMaterial(null, l);
                            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
                            mesh.renderOrder = 10 + lIdx; // Render floating PNGs after videos
                            ent.object3D.add(mesh);

                            const img = new Image();
                            img.crossOrigin = 'anonymous';
                            img.onload = () => {
                                const tex = new THREE.Texture(img);
                                tex.encoding = THREE.sRGBEncoding;
                                tex.needsUpdate = true;
                                if (img.naturalWidth && img.naturalHeight) {
                                    mesh.geometry.dispose();
                                    mesh.geometry = new THREE.PlaneGeometry(1, img.naturalHeight / img.naturalWidth);
                                }
                                mat.uniforms.src.value = tex;
                                mat.uniforms.hasTex.value = 1.0;
                            };
                            img.src = l.u;
                        }
                    });

                    // Per-Target Found / Lost Event Listeners
                    targetRootEl.addEventListener('targetFound', () => {
                        activeTargetsCount++;
                        statusEl.textContent = `🎯 Locked: ${tSlot.name}`;
                        setTimeout(() => { if (activeTargetsCount > 0) statusEl.style.opacity = '0'; }, 1200);

                        const vids = allVideosByTarget[tIdx] || [];
                        vids.forEach(vid => {
                            vid.muted = isMuted;
                            vid.play().catch(() => {
                                vid.muted = true;
                                isMuted = true;
                                vid.play().catch(() => {});
                            });
                        });
                        if (vids.length > 0) unmuteBtn.style.display = 'block';
                    });

                    targetRootEl.addEventListener('targetLost', () => {
                        activeTargetsCount = Math.max(0, activeTargetsCount - 1);
                        const vids = allVideosByTarget[tIdx] || [];
                        vids.forEach(vid => vid.pause());
                        if (activeTargetsCount === 0) {
                            statusEl.style.opacity = '1';
                            statusEl.textContent = '📷 Scan Print';
                        }
                    });
                });

                sceneEl.addEventListener('arReady', () => {
                    statusEl.textContent = `✅ Ready! Scan Print (${targetsList.length} Targets)`;
                });

            } catch (err) {
                statusEl.textContent = '❌ ' + err.message;
            }
        }

        function toggleAudio() {
            isMuted = !isMuted;
            Object.values(allVideosByTarget).flat().forEach(vid => {
                vid.muted = isMuted;
            });
            unmuteBtn.textContent = isMuted ? '🔇 Tap for Sound' : '🔊 Sound On';
        }

        unmuteBtn.addEventListener('click', toggleAudio);
        unmuteBtn.addEventListener('touchend', (e) => { e.preventDefault(); toggleAudio(); });
        window.addEventListener('load', bootV7);
    </script>
</body>
</html>
