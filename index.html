<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Gallery Player Pro</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #ui-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: #000; color: #fff; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: sans-serif; text-align: center;
      }
      button {
        padding: 15px 30px; font-size: 18px; font-weight: bold;
        background-color: #fff; color: #000; border: none; border-radius: 8px;
        margin-top: 20px; cursor: pointer;
      }
      .version-tag {
        position: absolute; bottom: 15px; font-size: 12px; color: #666;
      }
    </style>
  </head>
  
  <body>
    <div id="ui-layer">
      <h2>AR Gallery Ready</h2>
      <p>Please allow camera access when prompted.</p>
      <button id="start-btn">Tap to Start AR</button>
      <div class="version-tag">v3.0 - Dynamic</div>
    </div>

    <script>
      // 1. THE ADAPTIVE SHAPE ENGINE
      AFRAME.registerComponent('adaptive-ar', {
        schema: { vid: { type: 'selector' } },
        init: function () {
          const video = this.data.vid;
          const el = this.el;
          
          const applyResize = () => {
            if (video.videoWidth === 0) return; 
            const ratio = video.videoWidth / video.videoHeight;
            const targetHeight = 1 / ratio; 
            
            const aVideo = el.querySelector('a-video');
            aVideo.setAttribute('width', '1');
            aVideo.setAttribute('height', targetHeight.toString());
          };

          video.addEventListener('loadedmetadata', applyResize);
          if (video.readyState >= 1) applyResize();
        }
      });

      // 2. THE MASTER CONTROLLER
      document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const trackerLink = urlParams.get('mind');
        
        // Dynamically find how many videos (v1, v2, v3, etc.) are in the URL
        let videos = [];
        let index = 1;
        while (urlParams.has('v' + index)) {
          videos.push(urlParams.get('v' + index));
          index++;
        }

        if (trackerLink && videos.length > 0) {
          
          document.getElementById('start-btn').addEventListener('click', function() {
            document.getElementById('ui-layer').style.display = 'none';

            // Dynamically generate the HTML for the assets and AR targets
            let assetsHTML = '';
            let targetsHTML = '';

            for (let i = 0; i < videos.length; i++) {
              // Create the hidden video asset
              assetsHTML += `<video id="vid${i}" src="${videos[i]}" autoplay loop muted crossorigin="anonymous" playsinline></video>\n`;
              
              // Create the AR target that matches the image in the .mind file
              targetsHTML += `
                <a-entity mindar-image-target="targetIndex: ${i}" adaptive-ar="vid: #vid${i}">
                  <a-video src="#vid${i}" position="0 0 0" rotation="0 0 0"></a-video>
                </a-entity>\n`;
            }

            // Build the final scene
            const sceneHTML = `
              <a-scene mindar-image="imageTargetSrc: ${trackerLink};" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
                <a-assets>
                  ${assetsHTML}
                </a-assets>
                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                ${targetsHTML}
              </a-scene>
            `;
            
            document.body.insertAdjacentHTML('beforeend', sceneHTML);
          });

        } else {
          document.getElementById('ui-layer').innerHTML = "<h2>Data Missing</h2><p>Please scan a valid client print.</p><div class='version-tag'>v3.0 - Dynamic</div>";
        }
      });
    </script>
  </body>
</html>
