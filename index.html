<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Gallery Player</title>
    <!-- Load A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      // This script catches the Dropbox links from your QR code URL
      document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const trackerLink = urlParams.get('mind');
        const video1Link = urlParams.get('v1');
        const video2Link = urlParams.get('v2');

        if(trackerLink && video1Link && video2Link) {
          // Feed the links into the AR engine
          document.querySelector('a-scene').setAttribute('mindar-image', `imageTargetSrc: ${trackerLink};`);
          document.querySelector('#vid1').setAttribute('src', video1Link);
          document.querySelector('#vid2').setAttribute('src', video2Link);
        } else {
          alert("Awaiting QR Code Data. Please scan a valid client print.");
        }
      });
    </script>
  </head>
  
  <body>
    <!-- The AR Scene -->
    <a-scene color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Video Assets (Muted is required for iPhones to auto-play) -->
      <a-assets>
        <video id="vid1" autoplay loop muted crossorigin="anonymous" playsinline></video>
        <video id="vid2" autoplay loop muted crossorigin="anonymous" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 1 (Looks for the first photo) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#vid1" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Target 2 (Looks for the second photo) -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-video src="#vid2" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-video>
      </a-entity>
      
    </a-scene>
  </body>
</html>
