<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NIZHALI V7 // UNIVERSAL AR CLIENT</title>
  <link rel="stylesheet" href="./studio.css">
  <style>
    .ar-player-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-viewport);
      overflow: hidden;
    }
    #ar-camera-feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #ar-overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    .ar-top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .ar-bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="ar-player-shell viewport-container">
    <div class="viewport-axis-x"></div>
    <div class="viewport-axis-y"></div>

    <div class="target-frame-guide">
      <span class="target-frame-label" id="client-reticle-label">ALIGN PRINT / 3D TOY / FACE INSIDE RETICLE</span>
    </div>

    <video id="ar-camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-overlay-canvas"></canvas>

    <div class="ar-top-bar">
      <div class="hud-pill">
        <span class="brand-led"></span>
        <span>NIZHALI V7 // CLIENT PLAYER</span>
        <span>|</span>
        <span id="client-lock-state">READY</span>
      </div>
      <div class="hud-pill">
        <span id="client-mode-badge">MULTI-TRACKER</span>
      </div>
    </div>

    <div class="ar-bottom-bar">
      <button class="hw-btn active" id="btn-start-cam">START CAMERA</button>
      <button class="hw-btn accent-yellow" id="btn-load-project">LOAD PROJECT.JSON</button>
      <input type="file" id="file-project-json" accept=".json" style="display:none;">
    </div>
  </div>

  <script type="module">
    import { DropboxCryptoVault } from './modules/dropbox-crypto.js';
    import { Tracker3DEPnP } from './modules/tracker-3d-epnp.js';

    const videoEl = document.getElementById('ar-camera-feed');
    const lockStateEl = document.getElementById('client-lock-state');
    const modeBadgeEl = document.getElementById('client-mode-badge');
    const fileInput = document.getElementById('file-project-json');
    const tracker = new Tracker3DEPnP();

    document.getElementById('btn-start-cam').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        videoEl.srcObject = stream;
        lockStateEl.textContent = 'OPTICAL TRACKING ACTIVE';
      } catch (err) {
        lockStateEl.textContent = 'SIMULATION MODE (NO CAM)';
      }
    });

    document.getElementById('btn-load-project').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const project = JSON.parse(text);
      modeBadgeEl.textContent = `MODE: ${(project.trackingMode || 'PRINT').toUpperCase()}`;
      lockStateEl.textContent = `LOADED ${project.sceneNodes?.length || 0} NODES`;

      if (project.encryptedStream && project.encryptedStream.startsWith('NZ7$')) {
        try {
          const streamUrl = await DropboxCryptoVault.decryptLinkPayload(
            project.encryptedStream,
            'NIZHALI-V7-MASTER-KEY'
          );
          lockStateEl.textContent = 'AES-256 STREAM VERIFIED';
          console.log('Decrypted stream ready:', streamUrl);
        } catch (err) {
          lockStateEl.textContent = err.message;
        }
      }
    });
  </script>
</body>
</html>
