<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nizhali V5</title>

    <!-- 1. Load A-Frame First -->
    <script src="./aframe.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00ff88;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 99999;
            pointer-events: none;
            text-align: center;
            max-width: 90%;
        }

        #unmute-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="status">Booting Nizhali V5...</div>
    <button id="unmute-btn">🔇 Tap for Sound</button>

    <script type="module">
        // 2. Import MindAR Module (registers mindar-image with global AFRAME)
        import './mindar-image-aframe.prod.js';

        const statusEl = document.getElementById('status');
        const unmuteBtn = document.getElementById('unmute-btn');
        let activeVideo = null;
        let isMuted = true;

        function cleanDropbox(url) {
            if (!url) return '';
            return url.trim()
                .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                .replace('dropbox.com', 'dl.dropboxusercontent.com')
                .replace(/[?&]dl=[01]/g, '');
        }

        async function bootAR() {
            try {
                const params = new URLSearchParams(window.location.search);
                const mindUrl = cleanDropbox(params.get('mind'));
                const videoParam = params.get('video');

                if (!mindUrl || !videoParam) {
                    statusEl.textContent = '❌ Missing ?mind= or ?video= in link';
                    return;
                }

                // Verify the .mind file actually downloads from Dropbox before starting
                statusEl.textContent = '1/3 Verifying .mind file from Dropbox...';
                const checkRes = await fetch(mindUrl);
                if (!checkRes.ok) {
                    statusEl.textContent = `❌ Dropbox blocked .mind (${checkRes.status})`;
                    return;
                }
                const mindBuffer = await checkRes.arrayBuffer();
                if (mindBuffer.byteLength < 1000) {
                    statusEl.textContent = `❌ Invalid .mind file (${mindBuffer.byteLength} bytes)`;
                    return;
                }

                // Create local Blob URL from downloaded .mind buffer so MindAR loads it instantaneously
                const localMindBlobUrl = URL.createObjectURL(new Blob([mindBuffer]));
                statusEl.textContent = `2/3 Loaded .mind (${(mindBuffer.byteLength / 1024).toFixed(0)} KB). Starting Camera...`;

                const videos = videoParam.split(',').map(cleanDropbox);

                // Build A-Frame HTML string AFTER MindAR component is registered
                let assetsHtml = '';
                let targetsHtml = '';

                videos.forEach((url, index) => {
                    assetsHtml += `
                        <video id="vid-${index}" src="${url}" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
                    `;
                    targetsHtml += `
                        <a-entity id="target-${index}" mindar-image-target="targetIndex: ${index}">
                            <a-video id="plane-${index}" src="#vid-${index}" position="0 0 0" width="1" height="1"></a-video>
                        </a-entity>
                    `;
                });

                const sceneWrapper = document.createElement('div');
                sceneWrapper.style.width = '100%';
                sceneWrapper.style.height = '100%';
                sceneWrapper.innerHTML = `
                    <a-scene
                        id="ar-scene"
                        mindar-image="imageTargetSrc: ${localMindBlobUrl}; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;"
                        color-space="sRGB"
                        renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
                        vr-mode-ui="enabled: false"
                        device-orientation-permission-ui="enabled: false"
                        embedded>
                        <a-assets>${assetsHtml}</a-assets>
                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                        ${targetsHtml}
                    </a-scene>
                `;

                document.body.appendChild(sceneWrapper);

                const sceneEl = document.getElementById('ar-scene');

                videos.forEach((_, index) => {
                    const vid = document.getElementById(`vid-${index}`);
                    const plane = document.getElementById(`plane-${index}`);
                    const target = document.getElementById(`target-${index}`);

                    vid.addEventListener('loadedmetadata', () => {
                        if (vid.videoWidth && vid.videoHeight) {
                            plane.setAttribute('height', (vid.videoHeight / vid.videoWidth).toFixed(4));
                        }
                    });

                    target.addEventListener('targetFound', () => {
                        statusEl.textContent = '🎯 TARGET FOUND! Playing video...';
                        activeVideo = vid;
                        vid.muted = isMuted;
                        vid.play().catch(() => {
                            vid.muted = true;
                            isMuted = true;
                            vid.play();
                        });
                        unmuteBtn.style.display = 'block';
                    });

                    target.addEventListener('targetLost', () => {
                        statusEl.textContent = '👀 Target lost — scan image again';
                        vid.pause();
                    });
                });

                sceneEl.addEventListener('arReady', () => {
                    statusEl.textContent = `✅ Ready (${ (mindBuffer.byteLength / 1024).toFixed(0) }KB .mind)! Scan image`;
                });

                sceneEl.addEventListener('arError', () => {
                    statusEl.textContent = '❌ MindAR failed to parse .mind file';
                });

            } catch (err) {
                statusEl.textContent = '❌ Error: ' + err.message;
            }
        }

        unmuteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            if (activeVideo) {
                activeVideo.muted = isMuted;
                if (!isMuted) activeVideo.play();
            }
            unmuteBtn.textContent = isMuted ? '🔇 Tap for Sound' : '🔊 Sound On';
        });

        bootAR();
    </script>
</body>
</html>
