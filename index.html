<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Gallery Player Pro - Adaptive</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      // 1. CUSTOM ADAPTIVE COMPONENT
      // This script reads the video file and perfectly shapes the AR plane and masks.
      AFRAME.registerComponent('adaptive-ar', {
        schema: { vid: { type: 'selector' } },
        init: function () {
          const video = this.data.vid;
          const el = this.el;
          
          video.addEventListener('loadedmetadata', () => {
            const ratio = video.videoWidth / video.videoHeight;
            // MindAR always sets target width to 1. Height is proportional.
            const targetHeight = 1 / ratio; 
            
            // Resize the video plane
            const aVideo = el.querySelector('a-video');
            aVideo.setAttribute('width', '1');
            aVideo.setAttribute('height', targetHeight.toString());

            // Dynamically adjust the invisible occlusion masks to hug the exact edges
            const top = el.querySelector('.mask-top');
            top.setAttribute('position', `0 ${targetHeight/2 + 0.5} 0.01`);
            top.setAttribute('width', '3');
            top.setAttribute('height', '1');

            const bottom = el.querySelector('.mask-bottom');
            bottom.setAttribute('position', `0 ${-(targetHeight/2 + 0.5)} 0.01`);
            bottom.setAttribute('width', '3');
            bottom.setAttribute('height', '1');

            const left = el.querySelector('.mask-left');
            left.setAttribute('position', `-1 0 0.01`);
            left.setAttribute('width', '1');
            left.setAttribute('height', targetHeight + 2);

            const right = el.querySelector('.mask-right');
            right.setAttribute('position', `1 0 0.01`);
            right.setAttribute('width', '1');
            right.setAttribute('height', targetHeight + 2);
          });
        }
      });

      // 2. DROPBOX LINK CATCHER
      document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const trackerLink = urlParams.get('mind');
        const video1Link = urlParams.get('v1');
        const video2Link = urlParams.get('v2');

        if(trackerLink && video1Link && video2Link) {
          // Injecting the tracker with smoothing filters for stability
          document.querySelector('a-scene').setAttribute('mindar-image', `imageTargetSrc: ${trackerLink}; filterMinCF: 0.0001; filterBeta: 0.001;`);
          document.querySelector('#vid1').setAttribute('src', video1Link);
          document.querySelector('#vid2').setAttribute('src', video2Link);
        } else {
          alert("Awaiting QR Code Data.");
        }
      });
    </script>
  </head>
  
  <body>
    <a-scene color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="vid1" autoplay loop muted crossorigin="anonymous" playsinline></video>
        <video id="vid2" autoplay loop muted crossorigin="anonymous" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 1 (Runs the adaptive-ar script linked to vid1) -->
      <a-entity mindar-image-target="targetIndex: 0" adaptive-ar="vid: #vid1">
        <a-video src="#vid1" position="0 0 0" rotation="0 0 0"></a-video>
        <!-- Invisible Masks -->
        <a-plane class="mask-top" material="colorWrite: false"></a-plane>
        <a-plane class="mask-bottom" material="colorWrite: false"></a-plane>
        <a-plane class="mask-left" material="colorWrite: false"></a-plane>
        <a-plane class="mask-right" material="colorWrite: false"></a-plane>
      </a-entity>

      <!-- TARGET 2 (Runs the adaptive-ar script linked to vid2) -->
      <a-entity mindar-image-target="targetIndex: 1" adaptive-ar="vid: #vid2">
        <a-video src="#vid2" position="0 0 0" rotation="0 0 0"></a-video>
        <!-- Invisible Masks -->
        <a-plane class="mask-top" material="colorWrite: false"></a-plane>
        <a-plane class="mask-bottom" material="colorWrite: false"></a-plane>
        <a-plane class="mask-left" material="colorWrite: false"></a-plane>
        <a-plane class="mask-right" material="colorWrite: false"></a-plane>
      </a-entity>
      
    </a-scene>
  </body>
</html>
