<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nizhali V5 — AR Engine</title>

    <!-- 1. Self-Hosted Core Libraries -->
    <script src="./aframe.min.js"></script>
    <script src="./crypto-js.min.js"></script>
    <script type="module" src="./mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Force A-Frame canvas and MindAR camera video to fill 100% of iPhone screen */
        a-scene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1;
        }

        /* Nizhali UI Overlay */
        #nizhali-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 9999;
        }

        .brand-pill {
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.15);
        }

        #status-box {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 14px;
            text-align: center;
            max-width: 85%;
            border: 1px solid rgba(255,255,255,0.12);
            transition: opacity 0.3s ease;
        }

        #unmute-btn {
            pointer-events: auto;
            display: none;
            background: rgba(255, 255, 255, 0.95);
            color: #111;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <!-- Nizhali V5 HUD Overlay -->
    <div id="nizhali-overlay">
        <div class="brand-pill">Nizhali AR</div>
        <div id="status-box">Initializing Nizhali V5...</div>
        <button id="unmute-btn">🔇 Tap to Enable Sound</button>
    </div>

    <script>
        const statusBox = document.getElementById('status-box');
        const unmuteBtn = document.getElementById('unmute-btn');

        let activeVideoEl = null;
        let isGlobalMuted = true;

        function setStatus(msg, autoHide = false) {
            statusBox.style.opacity = '1';
            statusBox.innerHTML = msg;
            if (autoHide) {
                setTimeout(() => { statusBox.style.opacity = '0'; }, 2500);
            }
        }

        function cleanDropboxUrl(url) {
            if (!url) return '';
            let clean = url.trim();
            clean = clean.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
            clean = clean.replace('dropbox.com', 'dl.dropboxusercontent.com');
            clean = clean.replace('?dl=0', '').replace('&dl=0', '').replace('?dl=1', '').replace('&dl=1', '');
            return clean;
        }

        async function resolveProjectConfig() {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id');
            const secretKey = params.get('k');

            if (projectId) {
                setStatus('Unlocking Nizhali Vault...');
                const res = await fetch(`./clients.json?t=${Date.now()}`);
                if (!res.ok) throw new Error('Could not load clients.json switchboard.');
                const db = await res.json();
                const record = db[projectId];
                if (!record) throw new Error(`Project ID "${projectId}" not found.`);

                if (record.expires && new Date() > new Date(record.expires)) {
                    throw new Error('This AR Memory Pass has expired.');
                }

                if (record.encrypted) {
                    if (!secretKey) throw new Error('Missing security key (&k=) in QR link.');
                    const bytes = CryptoJS.AES.decrypt(record.encrypted, secretKey);
                    const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
                    if (!decryptedStr) throw new Error('Invalid security key.');
                    return JSON.parse(decryptedStr);
                }
                return record;
            }

            const rawMind = params.get('mind');
            const rawVideo = params.get('video');
            if (rawMind && rawVideo) {
                const videoList = rawVideo.split(',').map(v => cleanDropboxUrl(decodeURIComponent(v)));
                return {
                    mind: cleanDropboxUrl(decodeURIComponent(rawMind)),
                    videos: videoList
                };
            }

            throw new Error('No AR target provided in link.');
        }

        function launchAR(config) {
            const mindUrl = cleanDropboxUrl(config.mind);
            const videos = (config.videos || []).map(cleanDropboxUrl);

            setStatus('Starting Camera...');

            const sceneEl = document.createElement('a-scene');
            sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${mindUrl}; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;`);
            sceneEl.setAttribute('embedded', '');
            sceneEl.setAttribute('color-space', 'sRGB');
            sceneEl.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights: true, alpha: true');
            sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
            sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');

            const assetsEl = document.createElement('a-assets');
            sceneEl.appendChild(assetsEl);

            const cameraEl = document.createElement('a-camera');
            cameraEl.setAttribute('position', '0 0 0');
            cameraEl.setAttribute('look-controls', 'enabled: false');
            sceneEl.appendChild(cameraEl);

            videos.forEach((videoUrl, index) => {
                // Create HTML5 video element
                const vidEl = document.createElement('video');
                vidEl.id = `nizhali-vid-${index}`;
                vidEl.setAttribute('preload', 'metadata');
                vidEl.setAttribute('loop', '');
                vidEl.setAttribute('muted', '');
                vidEl.setAttribute('playsinline', '');
                vidEl.setAttribute('webkit-playsinline', '');
                vidEl.setAttribute('crossorigin', 'anonymous');
                vidEl.muted = true;
                vidEl.playsInline = true;
                vidEl.src = videoUrl;
                assetsEl.appendChild(vidEl);

                // Create Target Entity
                const targetEl = document.createElement('a-entity');
                targetEl.setAttribute('mindar-image-target', `targetIndex: ${index}`);

                // Create Video Plane inside Target
                const planeEl = document.createElement('a-video');
                planeEl.setAttribute('src', `#nizhali-vid-${index}`);
                planeEl.setAttribute('position', '0 0 0');
                planeEl.setAttribute('width', '1');
                planeEl.setAttribute('height', '1');
                targetEl.appendChild(planeEl);

                // Adjust aspect ratio automatically when video dimensions load
                vidEl.addEventListener('loadedmetadata', () => {
                    if (vidEl.videoWidth && vidEl.videoHeight) {
                        const aspect = vidEl.videoHeight / vidEl.videoWidth;
                        planeEl.setAttribute('width', '1');
                        planeEl.setAttribute('height', aspect.toFixed(4));
                    }
                });

                targetEl.addEventListener('targetFound', () => {
                    setStatus('✨ Target Found! Playing video...', true);
                    activeVideoEl = vidEl;
                    vidEl.muted = isGlobalMuted;
                    vidEl.play().catch(() => {
                        vidEl.muted = true;
                        isGlobalMuted = true;
                        vidEl.play();
                    });
                    unmuteBtn.style.display = 'block';
                    unmuteBtn.textContent = vidEl.muted ? '🔇 Tap to Enable Sound' : '🔊 Sound On';
                });

                targetEl.addEventListener('targetLost', () => {
                    setStatus('📷 Point camera at your print', true);
                    vidEl.pause();
                });

                sceneEl.appendChild(targetEl);
            });

            sceneEl.addEventListener('arReady', () => {
                setStatus('📷 Ready! Point camera at your print', true);
            });

            sceneEl.addEventListener('arError', () => {
                setStatus('❌ Failed to load .mind file or camera.');
            });

            // Append directly to body so MindAR fullscreen sizing works on iOS
            document.body.appendChild(sceneEl);
        }

        unmuteBtn.addEventListener('click', () => {
            isGlobalMuted = !isGlobalMuted;
            if (activeVideoEl) {
                activeVideoEl.muted = isGlobalMuted;
                if (!isGlobalMuted) activeVideoEl.play();
            }
            unmuteBtn.textContent = isGlobalMuted ? '🔇 Tap to Enable Sound' : '🔊 Sound On';
        });

        window.addEventListener('load', async () => {
            try {
                const config = await resolveProjectConfig();
                launchAR(config);
            } catch (err) {
                setStatus(`⚠️ ${err.message}`);
            }
        });
    </script>
</body>
</html>
