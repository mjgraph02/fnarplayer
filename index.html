<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nizhali V5 — AR Engine</title>

    <!-- 1. Self-Hosted Core Libraries -->
    <script src="./aframe.min.js"></script>
    <script src="./crypto-js.min.js"></script>
    <script type="module" src="./mindar-image-aframe.prod.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* Ensure A-Frame scene and camera feed sit cleanly in the background */
        a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { object-fit: cover; }

        /* Nizhali UI Overlay */
        #nizhali-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 24px; pointer-events: none; z-index: 9999;
        }

        .brand-pill {
            background: rgba(15, 15, 20, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: #fff; padding: 8px 18px; border-radius: 30px; font-size: 13px; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        #status-box {
            background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #fff; padding: 16px 24px; border-radius: 16px; font-size: 15px; text-align: center;
            max-width: 85%; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); transition: opacity 0.3s ease;
        }

        #unmute-btn {
            pointer-events: auto; display: none;
            background: rgba(255, 255, 255, 0.95); color: #111;
            border: none; padding: 12px 24px; border-radius: 30px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px; transition: transform 0.15s ease;
        }
        #unmute-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Nizhali V5 HUD Overlay -->
    <div id="nizhali-overlay">
        <div class="brand-pill">Nizhali AR</div>
        <div id="status-box">Initializing Nizhali V5 Engine...</div>
        <button id="unmute-btn">🔇 Tap to Enable Sound</button>
    </div>

    <!-- Dynamic AR Container (Injected once URL/Vault parameters are resolved) -->
    <div id="ar-container"></div>

    <script>
        // ==========================================
        // NIZHALI V5 CORE ENGINE
        // ==========================================
        const statusBox = document.getElementById('status-box');
        const unmuteBtn = document.getElementById('unmute-btn');
        const arContainer = document.getElementById('ar-container');

        let activeVideoEl = null;
        let isGlobalMuted = true;

        function setStatus(msg, autoHide = false) {
            statusBox.style.opacity = '1';
            statusBox.innerHTML = msg;
            if (autoHide) {
                setTimeout(() => { statusBox.style.opacity = '0'; }, 2500);
            }
        }

        // Convert any standard Dropbox link into a direct CORS-friendly stream URL
        function cleanDropboxUrl(url) {
            if (!url) return '';
            let clean = url.trim();
            clean = clean.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
            clean = clean.replace('dropbox.com', 'dl.dropboxusercontent.com');
            clean = clean.replace('?dl=0', '').replace('&dl=0', '').replace('?dl=1', '').replace('&dl=1', '');
            return clean;
        }

        // Resolve configuration from either Encrypted Switchboard (?id=...&k=...) OR Direct Test URL (?mind=...&video=...)
        async function resolveProjectConfig() {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id');
            const secretKey = params.get('k');

            // MODE A: Encrypted Vault Switchboard Mode (?id=client1&k=pass123)
            if (projectId) {
                setStatus('Unlocking Nizhali Vault...');
                const res = await fetch(`./clients.json?t=${Date.now()}`);
                if (!res.ok) throw new Error('Could not load clients.json switchboard.');
                const db = await res.json();
                const record = db[projectId];
                if (!record) throw new Error(`Project ID "${projectId}" not found.`);

                // Check optional expiry date (YYYY-MM-DD)
                if (record.expires && new Date() > new Date(record.expires)) {
                    throw new Error('This AR Memory Pass has expired.');
                }

                // If encrypted payload exists, decrypt with ?k= key
                if (record.encrypted) {
                    if (!secretKey) throw new Error('Missing security key (&k=) in QR link.');
                    const bytes = CryptoJS.AES.decrypt(record.encrypted, secretKey);
                    const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
                    if (!decryptedStr) throw new Error('Invalid security key.');
                    return JSON.parse(decryptedStr);
                }
                return record;
            }

            // MODE B: Direct Testing Mode (?mind=LINK&video=LINK1,LINK2)
            const rawMind = params.get('mind');
            const rawVideo = params.get('video');
            if (rawMind && rawVideo) {
                const videoList = rawVideo.split(',').map(v => cleanDropboxUrl(decodeURIComponent(v)));
                return {
                    mind: cleanDropboxUrl(decodeURIComponent(rawMind)),
                    videos: videoList
                };
            }

            throw new Error('No AR target provided.<br><small>Use ?mind=LINK&video=LINK to test, or ?id=ID&k=KEY</small>');
        }

        // Build the A-Frame + MindAR Scene with Lazy Video Loading
        function launchAR(config) {
            const mindUrl = cleanDropboxUrl(config.mind);
            const videos = (config.videos || []).map(cleanDropboxUrl);

            if (!mindUrl || videos.length === 0) {
                setStatus('Error: Missing .mind or video URLs in configuration.');
                return;
            }

            setStatus('Loading AR Scanner...<br><small>Please allow camera access</small>');

            // Wait until custom elements from mindar-image-aframe.prod.js module are registered
            const sceneEl = document.createElement('a-scene');
            sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${mindUrl}; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001;`);
            sceneEl.setAttribute('color-space', 'sRGB');
            sceneEl.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights: true, alpha: true');
            sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
            sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');

            const assetsEl = document.createElement('a-assets');
            sceneEl.appendChild(assetsEl);

            const cameraEl = document.createElement('a-camera');
            cameraEl.setAttribute('position', '0 0 0');
            cameraEl.setAttribute('look-controls', 'enabled: false');
            sceneEl.appendChild(cameraEl);

            // Create target entities for each video (Lazy Loaded on targetFound!)
            videos.forEach((videoUrl, index) => {
                const targetEl = document.createElement('a-entity');
                targetEl.setAttribute('mindar-image-target', `targetIndex: ${index}`);

                // Create hidden HTML5 video element (preload="none" saves iPhone RAM until scanned!)
                const vidEl = document.createElement('video');
                vidEl.id = `nizhali-vid-${index}`;
                vidEl.src = videoUrl;
                vidEl.setAttribute('preload', 'none');
                vidEl.setAttribute('loop', 'true');
                vidEl.setAttribute('muted', 'true');
                vidEl.setAttribute('playsinline', 'true');
                vidEl.setAttribute('webkit-playsinline', 'true');
                vidEl.setAttribute('crossorigin', 'anonymous');
                vidEl.muted = true;
                assetsEl.appendChild(vidEl);

                // Create A-Frame video plane
                const planeEl = document.createElement('a-video');
                planeEl.setAttribute('src', `#nizhali-vid-${index}`);
                planeEl.setAttribute('position', '0 0 0');
                planeEl.setAttribute('width', '1');
                planeEl.setAttribute('height', '1');
                planeEl.setAttribute('visible', 'false');
                targetEl.appendChild(planeEl);

                // Auto-adjust aspect ratio once video metadata loads
                vidEl.addEventListener('loadedmetadata', () => {
                    if (vidEl.videoWidth && vidEl.videoHeight) {
                        const aspect = vidEl.videoHeight / vidEl.videoWidth;
                        planeEl.setAttribute('width', '1');
                        planeEl.setAttribute('height', aspect.toFixed(4));
                    }
                });

                // When camera finds this specific target photo
                targetEl.addEventListener('targetFound', () => {
                    activeVideoEl = vidEl;
                    planeEl.setAttribute('visible', 'true');
                    vidEl.muted = isGlobalMuted;
                    
                    const playPromise = vidEl.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            // Fallback for strict iOS autoplay: play muted first
                            vidEl.muted = true;
                            isGlobalMuted = true;
                            vidEl.play();
                        });
                    }

                    unmuteBtn.style.display = 'block';
                    unmuteBtn.textContent = vidEl.muted ? '🔇 Tap to Enable Sound' : '🔊 Sound On';
                    setStatus('✨ Target Locked', true);
                });

                // When camera moves away from photo
                targetEl.addEventListener('targetLost', () => {
                    vidEl.pause();
                    planeEl.setAttribute('visible', 'false');
                });

                sceneEl.appendChild(targetEl);
            });

            // Scene lifecycle events
            sceneEl.addEventListener('arReady', () => {
                setStatus('📷 Point camera at your Nizhali print', true);
            });

            sceneEl.addEventListener('arError', () => {
                setStatus('❌ Camera or Tracking failed to start. Please check permissions.');
            });

            arContainer.appendChild(sceneEl);
        }

        // Sound toggle button for iOS Safari / Brave
        unmuteBtn.addEventListener('click', () => {
            isGlobalMuted = !isGlobalMuted;
            if (activeVideoEl) {
                activeVideoEl.muted = isGlobalMuted;
                if (!isGlobalMuted) activeVideoEl.play();
            }
            unmuteBtn.textContent = isGlobalMuted ? '🔇 Tap to Enable Sound' : '🔊 Sound On';
        });

        // Boot up once ES modules (mindar-image-aframe.prod.js) finish loading
        window.addEventListener('load', async () => {
            try {
                const config = await resolveProjectConfig();
                launchAR(config);
            } catch (err) {
                setStatus(`⚠️ ${err.message}`);
            }
        });
    </script>
</body>
</html>
