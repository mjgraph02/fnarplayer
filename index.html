<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nizhali V6 — Universal AR Player</title>

    <!-- 1. Self-Hosted A-Frame Core -->
    <script src="./aframe.min.js"></script>

    <script>
        // Universal Cross-Platform GLSL Chroma Key Shader (iOS WebKit, Android Blink, Desktop Chromium/Gecko)
        AFRAME.registerShader('chromakey', {
            schema: {
                src: { type: 'map', is: 'uniform' },
                color: { type: 'color', default: '#00ff00', is: 'uniform' },
                similarity: { type: 'number', default: 0.38, is: 'uniform' },
                smoothness: { type: 'number', default: 0.08, is: 'uniform' }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                #ifdef GL_FRAGMENT_PRECISION_HIGH
                precision highp float;
                #else
                precision mediump float;
                #endif

                uniform sampler2D src;
                uniform vec3 color;
                uniform float similarity;
                uniform float smoothness;
                varying vec2 vUv;

                void main() {
                    vec4 texColor = texture2D(src, vUv);
                    
                    // Convert RGB to YCrCb color space for lighting-independent color isolation
                    float Y1 = 0.2989 * texColor.r + 0.5866 * texColor.g + 0.1145 * texColor.b;
                    float Cr1 = texColor.r - Y1;
                    float Cb1 = texColor.b - Y1;

                    float Y2 = 0.2989 * color.r + 0.5866 * color.g + 0.1145 * color.b;
                    float Cr2 = color.r - Y2;
                    float Cb2 = color.b - Y2;

                    float dist = distance(vec2(Cr1, Cb1), vec2(Cr2, Cb2));
                    float blend = smoothstep(similarity, similarity + max(smoothness, 0.001), dist);

                    gl_FragColor = vec4(texColor.rgb * blend, texColor.a * blend);
                }
            `
        });
    </script>

    <style>
        :root {
            --app-height: 100%;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Scene Layer */
        a-scene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
        }

        /* Universal Fullscreen Camera Viewport handling for Android Navigation & iOS Safari Bars */
        .mindar-ui-overlay {
            z-index: 2 !important;
        }

        #status {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #00ff88;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            z-index: 99999;
            pointer-events: none;
            text-align: center;
            max-width: 88%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        #unmute-btn {
            position: fixed;
            bottom: calc(28px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: #ffffff;
            color: #111111;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            z-index: 99999;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.15s ease, background 0.2s ease;
        }

        #unmute-btn:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>
<body>

    <div id="status">Initializing Nizhali V6...</div>
    <button id="unmute-btn">🔇 Tap for Sound</button>

    <script type="module">
        import './mindar-image-aframe.prod.js';

        const statusEl = document.getElementById('status');
        const unmuteBtn = document.getElementById('unmute-btn');
        let videoElements = [];
        let isMuted = true;
        let activeTargetFound = false;

        // Handles standard, shared, and tokenized cloud storage URLs cleanly across browsers
        function cleanStorageUrl(url) {
            if (!url) return '';
            let clean = url.trim();
            if (clean.includes('dropbox.com')) {
                clean = clean.replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                             .replace('dropbox.com', 'dl.dropboxusercontent.com')
                             .replace(/[?&]dl=[01]/g, '');
            }
            return clean;
        }

        async function bootV6() {
            try {
                const params = new URLSearchParams(window.location.search);
                let mindUrl = '';
                let layers = [];

                // 1. Resolve Configuration (Studio Scene Mode vs Query String Direct Mode)
                if (params.get('scene')) {
                    const decoded = JSON.parse(decodeURIComponent(atob(params.get('scene'))));
                    mindUrl = cleanStorageUrl(decoded.m);
                    layers = decoded.l.map(item => ({
                        type: item.t,
                        url: cleanStorageUrl(item.u),
                        pos: (item.p || [0,0,0]).join(' '),
                        scale: (item.s || [1,1,1]).join(' '),
                        rot: (item.r || [0,0,0]).join(' '),
                        color: item.c || '#00ff00',
                        similarity: item.sim ?? 0.38,
                        smoothness: item.sm ?? 0.08
                    }));
                } else {
                    mindUrl = cleanStorageUrl(params.get('mind'));
                    const videoParam = params.get('video');
                    if (videoParam) {
                        const videoList = videoParam.split(',');
                        layers = videoList.map((vUrl, idx) => ({
                            type: 'video',
                            url: cleanStorageUrl(vUrl),
                            pos: '0 0 0',
                            scale: '1 1 1',
                            rot: '0 0 0',
                            targetIndex: idx
                        }));
                    }
                }

                if (!mindUrl || layers.length === 0) {
                    statusEl.textContent = '❌ Missing ?mind= or ?video= in URL';
                    return;
                }

                // 2. Fetch tracking target as binary array buffer
                statusEl.textContent = '1/2 Loading AR Target...';
                const checkRes = await fetch(mindUrl);
                if (!checkRes.ok) throw new Error(`Target file error (${checkRes.status})`);
                const mindBuffer = await checkRes.arrayBuffer();
                if (mindBuffer.byteLength < 1000) throw new Error('Target file is corrupted or incomplete');
                
                const localMindBlobUrl = URL.createObjectURL(new Blob([mindBuffer]));

                statusEl.textContent = '2/2 Starting Camera...';

                // 3. Build Asset and Entity trees with universal mobile/desktop attributes
                let assetsHtml = '';
                let entitiesHtml = '';

                layers.forEach((l, idx) => {
                    const targetIdx = l.targetIndex !== undefined ? l.targetIndex : 0;

                    if (l.type === 'video' || l.type === 'chroma') {
                        assetsHtml += `
                            <video id="vid-${idx}" 
                                   src="${l.url}" 
                                   preload="auto" 
                                   loop 
                                   muted 
                                   playsinline 
                                   webkit-playsinline 
                                   crossorigin="anonymous">
                            </video>
                        `;

                        if (l.type === 'chroma') {
                            entitiesHtml += `
                                <a-plane id="ent-${idx}" 
                                         position="${l.pos}" 
                                         scale="${l.scale}" 
                                         rotation="${l.rot}" 
                                         width="1" 
                                         height="1" 
                                         material="shader: chromakey; src: #vid-${idx}; color: ${l.color}; similarity: ${l.similarity}; smoothness: ${l.smoothness}; transparent: true; side: double">
                                </a-plane>
                            `;
                        } else {
                            entitiesHtml += `
                                <a-video id="ent-${idx}" 
                                         src="#vid-${idx}" 
                                         position="${l.pos}" 
                                         scale="${l.scale}" 
                                         rotation="${l.rot}" 
                                         width="1" 
                                         height="1">
                                </a-video>
                            `;
                        }
                    } else if (l.type === 'image') {
                        entitiesHtml += `
                            <a-image id="ent-${idx}" 
                                     src="${l.url}" 
                                     position="${l.pos}" 
                                     scale="${l.scale}" 
                                     rotation="${l.rot}" 
                                     width="1" 
                                     height="1" 
                                     material="transparent: true; alphaTest: 0.05; side: double">
                            </a-image>
                        `;
                    } else if (l.type === 'glb') {
                        entitiesHtml += `
                            <a-gltf-model id="ent-${idx}" 
                                          src="${l.url}" 
                                          position="${l.pos}" 
                                          scale="${l.scale}" 
                                          rotation="${l.rot}">
                            </a-gltf-model>
                        `;
                    }
                });

                // Device Pixel Ratio clamp prevents 3x/4x mobile GPU stalls while guaranteeing HD sharpness
                window.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2.0);

                const sceneWrapper = document.createElement('div');
                sceneWrapper.style.width = '100%';
                sceneWrapper.style.height = '100%';
                sceneWrapper.innerHTML = `
                    <a-scene
                        id="ar-scene"
                        mindar-image="imageTargetSrc: ${localMindBlobUrl}; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes; filterMinCF: 10; filterBeta: 10000; warmupTolerance: 1; missTolerance: 5;"
                        color-space="sRGB"
                        renderer="colorManagement: true, physicallyCorrectLights: false, alpha: true, antialias: true, powerPreference: high-performance"
                        vr-mode-ui="enabled: false"
                        device-orientation-permission-ui="enabled: false"
                        embedded>
                        <a-assets timeout="10000">${assetsHtml}</a-assets>
                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                        <a-entity id="target-root" mindar-image-target="targetIndex: 0">
                            ${entitiesHtml}
                        </a-entity>
                    </a-scene>
                `;

                document.body.appendChild(sceneWrapper);

                const sceneEl = document.getElementById('ar-scene');
                const targetRoot = document.getElementById('target-root');

                // Bind Video Aspect Ratio and Autoplay handling
                layers.forEach((l, idx) => {
                    if (l.type === 'video' || l.type === 'chroma') {
                        const vid = document.getElementById(`vid-${idx}`);
                        const ent = document.getElementById(`ent-${idx}`);
                        videoElements.push(vid);

                        vid.addEventListener('loadedmetadata', () => {
                            if (vid.videoWidth && vid.videoHeight && l.scale === '1 1 1') {
                                ent.setAttribute('height', (vid.videoHeight / vid.videoWidth).toFixed(4));
                            }
                        });
                    }
                });

                // Universal Tracking Handlers
                targetRoot.addEventListener('targetFound', () => {
                    activeTargetFound = true;
                    statusEl.textContent = '🎯 Target Locked';
                    setTimeout(() => { 
                        if (activeTargetFound) statusEl.style.opacity = '0'; 
                    }, 1500);

                    videoElements.forEach(vid => {
                        vid.muted = isMuted;
                        const promise = vid.play();
                        if (promise !== undefined) {
                            promise.catch(() => {
                                // Fallback for strict browser autonomy policies: play muted first
                                vid.muted = true;
                                isMuted = true;
                                vid.play();
                            });
                        }
                    });

                    if (videoElements.length > 0) {
                        unmuteBtn.style.display = 'block';
                    }
                });

                targetRoot.addEventListener('targetLost', () => {
                    activeTargetFound = false;
                    statusEl.style.opacity = '1';
                    statusEl.textContent = '📷 Scan Print';
                    videoElements.forEach(vid => vid.pause());
                });

                sceneEl.addEventListener('arReady', () => {
                    statusEl.textContent = '✅ AR Ready! Scan Print';
                });

                sceneEl.addEventListener('arError', () => {
                    statusEl.textContent = '❌ Camera or AR target error';
                });

            } catch (err) {
                statusEl.textContent = '❌ ' + err.message;
            }
        }

        // Global User-Gesture Audio Unlock (Works across iOS Safari/Brave, Android Chrome, and Desktop)
        function toggleAudio() {
            isMuted = !isMuted;
            videoElements.forEach(vid => {
                vid.muted = isMuted;
                if (!isMuted) vid.play();
            });
            unmuteBtn.textContent = isMuted ? '🔇 Tap for Sound' : '🔊 Sound On';
        }

        unmuteBtn.addEventListener('click', toggleAudio);
        unmuteBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            toggleAudio();
        });

        window.addEventListener('load', bootV6);
    </script>
</body>
</html>
